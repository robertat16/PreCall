name: Publish privacy policy

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Insert support email
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          if [ -z "$SUPPORT_EMAIL" ]; then
            echo "::error::Set the SUPPORT_EMAIL repository variable first (Settings > Secrets and variables > Actions > Variables), then re-run this workflow."
            exit 1
          fi
          sed -i "s/__SUPPORT_EMAIL__/${SUPPORT_EMAIL}/g" docs/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
